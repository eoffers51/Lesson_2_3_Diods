<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 800 600" width="800" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Wiring of the superloop homework (lesson 2.3, three LEDs). Same pins as main/main.c and diagram.json. -->
  <rect x="0" y="-50" width="800" height="600" rx="16" fill="#ffffff"/>
  <text x="24" y="-18" font-size="20" font-weight="700" fill="#202124">Superloop, 3 independent LEDs: wiring</text>
  <text x="24" y="2" font-size="13" fill="#5f6368">ESP32-S3-DevKitC-1 (YD-ESP32-S3 clone) · 3 external LEDs · 220 Ω each · active HIGH</text>

  <!-- ===== Board ===== -->
  <rect x="320" y="30" width="180" height="480" rx="10" fill="#1f2a36"/>
  <rect x="378" y="40" width="64" height="20" rx="2" fill="#2c3a48"/>            <!-- antenna -->
  <rect x="372" y="62" width="76" height="120" rx="4" fill="#b8bec6"/>          <!-- module shield -->
  <text x="410" y="118" font-size="10" fill="#3c4043" text-anchor="middle" font-weight="700">ESP32-S3</text>
  <text x="410" y="132" font-size="9" fill="#3c4043" text-anchor="middle">WROOM-1</text>
  <rect x="380" y="512" width="34" height="18" rx="3" fill="#9aa0a6"/>          <!-- USB -->
  <rect x="426" y="512" width="34" height="18" rx="3" fill="#9aa0a6"/>
  <text x="397" y="545" font-size="9" fill="#5f6368" text-anchor="middle">UART</text>
  <text x="443" y="545" font-size="9" fill="#5f6368" text-anchor="middle">USB</text>

  <!-- J1 header (left), top to bottom; used pins are bright -->
  <g font-size="9" fill="#8a96a3">
    <g fill="#5d6873">
      <rect x="327" y="65" width="10" height="10"/><rect x="327" y="83" width="10" height="10"/><rect x="327" y="101" width="10" height="10"/><rect x="327" y="119" width="10" height="10"/><rect x="327" y="137" width="10" height="10"/><rect x="327" y="155" width="10" height="10"/><rect x="327" y="173" width="10" height="10"/><rect x="327" y="191" width="10" height="10"/><rect x="327" y="209" width="10" height="10"/><rect x="327" y="227" width="10" height="10"/><rect x="327" y="245" width="10" height="10"/><rect x="327" y="263" width="10" height="10"/><rect x="327" y="281" width="10" height="10"/><rect x="327" y="299" width="10" height="10"/><rect x="327" y="317" width="10" height="10"/><rect x="327" y="335" width="10" height="10"/><rect x="327" y="353" width="10" height="10"/><rect x="327" y="371" width="10" height="10"/><rect x="327" y="389" width="10" height="10"/><rect x="327" y="407" width="10" height="10"/><rect x="327" y="425" width="10" height="10"/><rect x="327" y="443" width="10" height="10"/>
    </g>
    <text x="343" y="73">3V3</text><text x="343" y="91">3V3</text><text x="343" y="109">RST</text><text x="343" y="181">7</text><text x="343" y="199">15</text><text x="343" y="217">16</text><text x="343" y="235">17</text><text x="343" y="253">18</text><text x="343" y="271">8</text><text x="343" y="289">3</text><text x="343" y="307">46</text><text x="343" y="325">9</text><text x="343" y="343">10</text><text x="343" y="361">11</text><text x="343" y="379">12</text><text x="343" y="397">13</text><text x="343" y="415">14</text><text x="343" y="433">5V</text>
  </g>
  <!-- J3 header (right) -->
  <g font-size="9" fill="#8a96a3" text-anchor="end">
    <g fill="#5d6873">
      <rect x="483" y="65" width="10" height="10"/><rect x="483" y="83" width="10" height="10"/><rect x="483" y="101" width="10" height="10"/><rect x="483" y="119" width="10" height="10"/><rect x="483" y="137" width="10" height="10"/><rect x="483" y="155" width="10" height="10"/><rect x="483" y="173" width="10" height="10"/><rect x="483" y="191" width="10" height="10"/><rect x="483" y="209" width="10" height="10"/><rect x="483" y="227" width="10" height="10"/><rect x="483" y="245" width="10" height="10"/><rect x="483" y="263" width="10" height="10"/><rect x="483" y="281" width="10" height="10"/><rect x="483" y="299" width="10" height="10"/><rect x="483" y="317" width="10" height="10"/><rect x="483" y="335" width="10" height="10"/><rect x="483" y="353" width="10" height="10"/><rect x="483" y="371" width="10" height="10"/><rect x="483" y="389" width="10" height="10"/><rect x="483" y="407" width="10" height="10"/><rect x="483" y="425" width="10" height="10"/><rect x="483" y="443" width="10" height="10"/>
    </g>
    <text x="477" y="73">G</text><text x="477" y="91">TX</text><text x="477" y="109">RX</text><text x="477" y="127">1</text><text x="477" y="145">2</text><text x="477" y="163">42</text><text x="477" y="181">41</text><text x="477" y="199">40</text><text x="477" y="217">39</text><text x="477" y="235">38</text><text x="477" y="253">37</text><text x="477" y="271">36</text><text x="477" y="289">35</text><text x="477" y="307">0</text><text x="477" y="325">45</text><text x="477" y="343">48</text><text x="477" y="361">47</text><text x="477" y="379">21</text><text x="477" y="397">20</text><text x="477" y="415">19</text><text x="477" y="433">G</text><text x="477" y="451">G</text>
  </g>
  <!-- used pins highlighted: 4, 5, 6 and G (bottom of J1) -->
  <g fill="#f9ab00">
    <rect x="327" y="119" width="10" height="10"/><rect x="327" y="137" width="10" height="10"/><rect x="327" y="155" width="10" height="10"/><rect x="327" y="443" width="10" height="10"/>
  </g>
  <g font-size="10" font-weight="700" fill="#ffffff">
    <text x="343" y="127">4</text><text x="343" y="145">5</text><text x="343" y="163">6</text><text x="343" y="451">G</text>
  </g>

  <!-- onboard RGB LED (GPIO48), not used here -->
  <rect x="398" y="290" width="24" height="24" rx="3" fill="#ffffff"/>
  <circle cx="410" cy="302" r="7" fill="url(#rgb)"/>
  <text x="410" y="328" font-size="9" fill="#e8eaed" text-anchor="middle">RGB</text>
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea4335"/><stop offset="0.5" stop-color="#34a853"/><stop offset="1" stop-color="#4285f4"/>
    </linearGradient>
  </defs>

  <!-- ===== Wires ===== -->
  <!-- each GPIO fans out to its own row so the parts don't crowd: LED1 y=90, LED2 y=210, LED3 y=330 -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 124 H260 V90 H240" stroke="#e8710a"/>                <!-- GPIO4 -> R1 -->
    <path d="M190 90 H160" stroke="#e8710a"/>                          <!-- R1 -> LED1 anode -->
    <path d="M332 142 H280 V210 H240" stroke="#1a73e8"/>               <!-- GPIO5 -> R2 -->
    <path d="M190 210 H160" stroke="#1a73e8"/>
    <path d="M332 160 H300 V330 H240" stroke="#188038"/>               <!-- GPIO6 -> R3 -->
    <path d="M190 330 H160" stroke="#188038"/>
    <path d="M124 90 H70 V448 H332 M124 210 H70 M124 330 H70" stroke="#3c4043"/>  <!-- cathodes -> GND -->
  </g>
  <circle cx="70" cy="210" r="6" fill="#3c4043"/>
  <circle cx="70" cy="330" r="6" fill="#3c4043"/>
  <text x="200" y="442" font-size="10" fill="#3c4043" font-weight="700">GND</text>

  <!-- ===== Resistors (220 Ω: red red brown) ===== -->
  <g stroke="#8d6e3f" stroke-width="1">
    <rect x="190" y="83" width="50" height="14" rx="6" fill="#e8d2a6"/>
    <rect x="190" y="203" width="50" height="14" rx="6" fill="#e8d2a6"/>
    <rect x="190" y="323" width="50" height="14" rx="6" fill="#e8d2a6"/>
  </g>
  <g fill="#c5221f">
    <rect x="199" y="83" width="4" height="14"/><rect x="207" y="83" width="4" height="14"/><rect x="215" y="83" width="4" height="14" fill="#5d4037"/>
    <rect x="199" y="203" width="4" height="14"/><rect x="207" y="203" width="4" height="14"/><rect x="215" y="203" width="4" height="14" fill="#5d4037"/>
    <rect x="199" y="323" width="4" height="14"/><rect x="207" y="323" width="4" height="14"/><rect x="215" y="323" width="4" height="14" fill="#5d4037"/>
  </g>
  <g font-size="10" fill="#5f6368" text-anchor="middle">
    <text x="215" y="114">220 Ω</text>
    <text x="215" y="234">220 Ω</text>
    <text x="215" y="354">220 Ω</text>
  </g>

  <!-- ===== LEDs (triangle points from anode to cathode) ===== -->
  <polygon points="160,78 160,102 132,90" fill="#ea4335" stroke="#c5221f" stroke-width="2"/>
  <line x1="128" y1="77" x2="128" y2="103" stroke="#c5221f" stroke-width="3"/>
  <path d="M138 72 l-8 -10 M148 72 l-8 -10" stroke="#ea4335" stroke-width="2"/>
  <polygon points="160,198 160,222 132,210" fill="#fbbc04" stroke="#e37400" stroke-width="2"/>
  <line x1="128" y1="197" x2="128" y2="223" stroke="#e37400" stroke-width="3"/>
  <path d="M138 192 l-8 -10 M148 192 l-8 -10" stroke="#fbbc04" stroke-width="2"/>
  <polygon points="160,318 160,342 132,330" fill="#34a853" stroke="#188038" stroke-width="2"/>
  <line x1="128" y1="317" x2="128" y2="343" stroke="#188038" stroke-width="3"/>
  <path d="M138 312 l-8 -10 M148 312 l-8 -10" stroke="#34a853" stroke-width="2"/>

  <!-- row labels -->
  <g font-size="12" font-weight="700">
    <text x="90" y="132" fill="#e8710a">LED1 · GPIO4 · 200 ms</text>
    <text x="90" y="252" fill="#1a73e8">LED2 · GPIO5 · 500 ms</text>
    <text x="90" y="372" fill="#188038">LED3 · GPIO6 · 1000 ms</text>
  </g>

  <!-- ===== Info box ===== -->
  <g font-size="12" fill="#202124">
    <rect x="520" y="60" width="256" height="160" rx="10" fill="#f1f3f4"/>
    <text x="536" y="84" font-weight="700">Each LED: GPIO → 220 Ω → LED → GND</text>
    <text x="536" y="108">pin HIGH (3.3 V)</text><text x="680" y="108" font-weight="700" fill="#188038">LED on</text>
    <text x="536" y="130">pin LOW (0 V)</text><text x="680" y="130" font-weight="700" fill="#5f6368">LED off</text>
    <text x="536" y="156" font-size="11" fill="#5f6368">Long leg (anode) to the resistor,</text>
    <text x="536" y="172" font-size="11" fill="#5f6368">short leg / flat side (cathode) to GND.</text>
    <text x="536" y="196" font-size="11" fill="#5f6368">I ≈ (3.3 − 2.0 V) / 220 Ω ≈ 6 mA per LED</text>
  </g>

  <!-- callout: RGB not used -->
  <g fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3">
    <path d="M422 302 H520"/>
  </g>
  <g font-size="12" fill="#202124">
    <text x="526" y="298" font-weight="700">GPIO48: onboard RGB</text>
    <text x="526" y="314" fill="#5f6368">not used in this project</text>
  </g>
</svg>
