dependencies:
  idf:
    version: ">=6.0"
  # SEGGER SystemView tracing (see "Recording the tasks with SystemView" in the
  # README). Only downloaded when the trace build turns the external trace
  # library on (sdkconfig.sysview_jtag), so the normal builds don't need it.
  # Pinned to 1.0.x: 1.1.x calls the encoder `flush` hook that esp_trace only
  # has from IDF v6.1. On v6.0.2 it fails with
  # "'esp_trace_encoder_vtable_t' has no member named 'flush'".
  espressif/esp_sysview:
    version: "~1.0.2"
    rules:
      - if: "$CONFIG{ESP_TRACE_LIB_EXTERNAL} == True"
